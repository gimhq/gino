name: release

# Builds and uploads lode release assets to an EXISTING GitHub Release.
# Publishing the release is the source of truth (not a tag push), which avoids
# building against a tag/release mismatch. The host bundle (gino.js) + its
# lode/v1 manifest, and the agent static binary, are attached to the release;
# lode (github source) reads them by filename.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build assets for, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.0"
  APP_NAME: gino-host
  HOST_ASSET: gino.js
  AGENT_ASSET: gino-agent-linux-x64
  # Untrusted-input-safe: the tag flows through an env var, never inlined into a run/ref.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  host:
    name: host bundle + manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve release metadata
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          version="${tag#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${HOST_ASSET}"
          {
            echo "TAG_NAME=${tag}"
            echo "RELEASE_VERSION=${version}"
            echo "ASSET_URL=${url}"
          } >> "${GITHUB_ENV}"

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package lode asset (bundle + manifest + checksums)
        run: |
          set -euo pipefail
          bun run package --version "${RELEASE_VERSION}" --asset-url "${ASSET_URL}"

      - name: Validate lode release assets
        run: |
          set -euo pipefail
          bun apps/host/scripts/validate-release.ts \
            --app-name "${APP_NAME}" \
            --asset-name "${HOST_ASSET}" \
            --version "${RELEASE_VERSION}" \
            --asset-url "${ASSET_URL}"

      # OPTIONAL signing (ed25519). Set a publisher key as the secret
      # LODE_SIGN_KEY to sign the asset + catalog with lode-cli; skipped otherwise
      # (an unsigned manifest still carries integrity).
      #   - run: lode-cli sign "apps/host/dist/${HOST_ASSET}" --version "${RELEASE_VERSION}" --key-env LODE_SIGN_KEY ...
      #   - run: lode-cli manifest-sign --into apps/host/dist/manifest.json --key-env LODE_SIGN_KEY

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${TAG_NAME}" >/dev/null
          gh release upload "${TAG_NAME}" \
            "apps/host/dist/${HOST_ASSET}" \
            apps/host/dist/manifest.json \
            apps/host/dist/checksums.txt \
            --clobber

  agent:
    name: agent static binary (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gino-agent
    steps:
      - name: Resolve release metadata
        run: echo "TAG_NAME=${RELEASE_TAG}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: System deps (musl cross + C toolchain)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools musl-dev cmake clang libclang-dev

      - name: Rust toolchain + musl target
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-release-${{ hashFiles('gino-agent/Cargo.lock') }}

      # Fully static, non-PIE musl binary — runs on any base, the portable lode asset for the agent.
      - name: Build (static musl)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: "-C target-feature=+crt-static -C relocation-model=static"
        run: |
          set -euo pipefail
          cargo build --release --locked --target x86_64-unknown-linux-musl
          install -m 0755 "target/x86_64-unknown-linux-musl/release/gino-agent" "${AGENT_ASSET}"
          sha256sum "${AGENT_ASSET}" | tee "${AGENT_ASSET}.sha256"

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${TAG_NAME}" >/dev/null
          gh release upload "${TAG_NAME}" \
            "gino-agent/${AGENT_ASSET}" \
            "gino-agent/${AGENT_ASSET}.sha256" \
            --clobber
